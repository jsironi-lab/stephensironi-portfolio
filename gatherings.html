    <h1 class="sr-only">Gatherings — Paintings by Stephen Sironi</h1>
    <div class="gallery-arrow left" id="arrowLeft"><span>&larr;</span></div>
    <div class="gallery-arrow right" id="arrowRight"><span>&rarr;</span></div>
    <div class="gallery-container">
        <div class="gallery-scroll" id="gallery"></div>
    </div>
    <div class="lightbox" id="lightbox">
        <button class="close-lightbox" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content">
            <img src="" alt="" class="lightbox-image" id="lightboxImage">
            <div class="lightbox-info">
                <h2 id="lightboxTitle"></h2>
                <div class="medium" id="lightboxMedium"></div>
                <div class="size" id="lightboxSize"></div>
                <div class="location" id="lightboxLocation"></div>
                <div class="description" id="lightboxDescription"></div>
                <a href="#" class="order-button" id="orderButton">Inquire</a>
                <div class="unavailable-badge" id="unavailableBadge" style="display:none;">Temporarily Unavailable</div>
            </div>
        </div>
    </div>
    <script>
        const paintings = [
            {title: "Watching the Eclipse", folder: "gatherings", filename: "watching-the-eclipse.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Delaware, OH", price: "300", description: "A seated crowd wearing eclipse glasses looks upward during a solar eclipse, with chairs and parked cars visible behind them.", availability: "no"},
            {title: "Dancing in the Street", folder: "gatherings", filename: "dancing-in-the-street.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Provincetown, MA", price: "300", description: "People in traditional costumes dance in the street in Provincetown, Massachusetts, as onlookers stand along the sidewalk.", availability: "yes"},
            {title: "Moshing", folder: "gatherings", filename: "moshing.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Location n/a", price: "300", description: "Figures with raised arms cluster together as one person is lifted above the group, creating a layered scene of movement and contact.", availability: "no"},
            {title: "Only Have Eyes for You", folder: "gatherings", filename: "only-have-eyes-for-you.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Waterford, VA", price: "300", description: "Newlyweds dance closely in the foreground while groups of people mingle in a warmly lit space behind them.", availability: "yes"},
            {title: "Pipers on Parade", folder: "gatherings", filename: "pipers-on-parade.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Plymouth, MA", price: "300", description: "Bagpipers in uniform march past a gathered crowd, performing along a city sidewalk.", availability: "yes"},
            {title: "Some People Like to Dance", folder: "gatherings", filename: "some-people-like-to-dance.jpg", medium: "Mixed-media Collage", size: "n/a", location: "Location n/a", price: "300", description: "Overlapping cut-out figures of dancers and musicians fill the frame, layered over a crowded outdoor gathering.", availability: "no"}
        ];

        const gallery = document.getElementById('gallery');
        paintings.forEach((painting, index) => {
            const item = document.createElement('div');
            item.className = 'painting-item';
            item.innerHTML = `<img loading="lazy" src="images/paintings/${painting.folder}/${painting.filename}" alt="${painting.title}"><div class="painting-caption"><div class="title">${painting.title}</div><div class="medium">${painting.medium}</div></div>`;
            item.onclick = () => openLightbox(index);
            gallery.appendChild(item);
        });

        function openLightbox(index) {
            const painting = paintings[index];
            document.getElementById('lightboxImage').src = `images/paintings/${painting.folder}/${painting.filename}`;
            document.getElementById('lightboxImage').alt = painting.title;
            document.getElementById('lightboxTitle').textContent = painting.title;
            document.getElementById('lightboxMedium').textContent = painting.medium;
            const sizeEl = document.getElementById('lightboxSize');
            if (painting.size && painting.size !== 'n/a') {
                sizeEl.textContent = painting.size;
                sizeEl.style.display = '';
            } else {
                sizeEl.style.display = 'none';
            }
            document.getElementById('lightboxLocation').textContent = painting.location;
            document.getElementById('lightboxDescription').textContent = painting.description;
            if (painting.availability === 'yes') {
                document.getElementById('orderButton').href = `contact.html?painting=${encodeURIComponent(painting.title)}`;
                document.getElementById('orderButton').style.display = 'inline-block';
                document.getElementById('unavailableBadge').style.display = 'none';
            } else {
                document.getElementById('orderButton').style.display = 'none';
                document.getElementById('unavailableBadge').style.display = 'inline-block';
            }
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target === this) closeLightbox(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });




        const container = document.querySelector('.gallery-container');
        const arrowLeft = document.getElementById('arrowLeft');
        const arrowRight = document.getElementById('arrowRight');
        let currentIndex = 0;
        const totalPaintings = paintings.length;

        arrowRight.addEventListener('click', function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % totalPaintings;
            const items = document.querySelectorAll('.painting-item');
            const item = items[currentIndex];
            const targetLeft = item.offsetLeft - 96;
            if (currentIndex === 0) { container.scrollTo({ left: 0, behavior: 'auto' }); }
            else { container.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' }); }
        });

        arrowLeft.addEventListener('click', function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + totalPaintings) % totalPaintings;
            const items = document.querySelectorAll('.painting-item');
            const item = items[currentIndex];
            const targetLeft = item.offsetLeft - 96;
            if (currentIndex === totalPaintings - 1) { container.scrollTo({ left: container.scrollWidth, behavior: 'auto' }); }
            else { container.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' }); }
        });

        container.addEventListener('scrollend', function() {
            const items = document.querySelectorAll('.painting-item');
            const center = container.scrollLeft + container.clientWidth / 2;
            let closest = 0, closestDist = Infinity;
            items.forEach((item, i) => {
                const dist = Math.abs((item.offsetLeft + item.offsetWidth / 2) - center);
                if (dist < closestDist) { closestDist = dist; closest = i; }
            });
            currentIndex = closest;
        });


    </script>
