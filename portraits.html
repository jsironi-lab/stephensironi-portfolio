    <h1 class="sr-only">Portraits &amp; Still Life — Paintings by Stephen Sironi</h1>
    <div class="gallery-arrow left" id="arrowLeft"><span>&larr;</span></div>
    <div class="gallery-arrow right" id="arrowRight"><span>&rarr;</span></div>
    <div class="gallery-container">
        <div class="gallery-scroll" id="gallery"></div>
    </div>
    <div class="lightbox" id="lightbox">
        <button class="close-lightbox" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content">
            <img src="" alt="" class="lightbox-image" id="lightboxImage">
            <div class="lightbox-info">
                <h2 id="lightboxTitle"></h2>
                <div class="medium" id="lightboxMedium"></div>
                <div class="size" id="lightboxSize"></div>
                <div class="location" id="lightboxLocation"></div>
                <div class="description" id="lightboxDescription"></div>
                <a href="#" class="order-button" id="orderButton">Inquire</a>
                <div class="unavailable-badge" id="unavailableBadge" style="display:none;">Temporarily Unavailable</div>
            </div>
        </div>
    </div>
    <script>
        const paintings = [
            {title: "Suzette No 1", folder: "portraits", filename: "suzette-no-1.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Location n/a", price: "300", description: "A woman sits at a bar holding a drink, with the bar interior behind her.", availability: "yes"},
            {title: "Man in Pink Shirt", folder: "portraits", filename: "man-in-pink-shirt.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Location n/a", price: "300", description: "A man in a pink shirt stands in front of a yellow background, holding an object.", availability: "yes"},
            {title: "Doughnuts", folder: "portraits", filename: "doughnuts.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Portland, ME", price: "300", description: "Assorted doughnuts are stacked in rows, their glazes and fillings rendered with broad, textured brush strokes.", availability: "yes"},
            {title: "Linda", folder: "portraits", filename: "linda.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Location n/a", price: "300", description: "A woman reads a newspaper while reclining in a striped armchair, her feet propped on a footstool in a softly lit interior.", availability: "yes"},
            {title: "Skier in Gondola", folder: "portraits", filename: "skier-in-gondola.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Mammoth Lakes, CA", price: "300", description: "A skier in winter gear sits inside a gondola, with snow-covered mountains visible through the windows.", availability: "yes"},
            {title: "Man in Beige", folder: "portraits", filename: "man-in-beige.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Location n/a", price: "300", description: "A man in a light shirt and beige pants walks along a sidewalk holding a paper shopping bag, with storefront windows in the background.", availability: "yes"},
            {title: "Kayaks", folder: "portraits", filename: "kayaks.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Damariscotta, ME", price: "300", description: "Boats rest along the shoreline at night as moonlight reflects across calm water, with trees visible along the lake's edge.", availability: "yes"},
            {title: "Young Man at the Ready", folder: "portraits", filename: "young-man-at-the-ready.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Hanover, MA", price: "300", description: "A man in a safety vest stands beside a green cart on a paved area, with buildings visible behind him.", availability: "no"},
            {title: "Suzette No 2", folder: "portraits", filename: "suzette-no-2.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Location n/a", price: "300", description: "A seated woman smiles softly, set against a dark background.", availability: "no"},
            {title: "Self Portrait", folder: "portraits", filename: "self-portrait.jpg", medium: "Acrylic on Canvas", size: "n/a", location: "Location n/a", price: "300", description: "A self-portrait of the artist.", availability: "no"}
        ];

        const gallery = document.getElementById('gallery');
        paintings.forEach((painting, index) => {
            const item = document.createElement('div');
            item.className = 'painting-item';
            item.innerHTML = `<img loading="lazy" src="images/paintings/${painting.folder}/${painting.filename}" alt="${painting.title}"><div class="painting-caption"><div class="title">${painting.title}</div><div class="medium">${painting.medium}</div></div>`;
            item.onclick = () => openLightbox(index);
            gallery.appendChild(item);
        });

        function openLightbox(index) {
            const painting = paintings[index];
            document.getElementById('lightboxImage').src = `images/paintings/${painting.folder}/${painting.filename}`;
            document.getElementById('lightboxImage').alt = painting.title;
            document.getElementById('lightboxTitle').textContent = painting.title;
            document.getElementById('lightboxMedium').textContent = painting.medium;
            const sizeEl = document.getElementById('lightboxSize');
            if (painting.size && painting.size !== 'n/a') {
                sizeEl.textContent = painting.size;
                sizeEl.style.display = '';
            } else {
                sizeEl.style.display = 'none';
            }
            document.getElementById('lightboxLocation').textContent = painting.location;
            document.getElementById('lightboxDescription').textContent = painting.description;
            if (painting.availability === 'yes') {
                document.getElementById('orderButton').href = `contact.html?painting=${encodeURIComponent(painting.title)}`;
                document.getElementById('orderButton').style.display = 'inline-block';
                document.getElementById('unavailableBadge').style.display = 'none';
            } else {
                document.getElementById('orderButton').style.display = 'none';
                document.getElementById('unavailableBadge').style.display = 'inline-block';
            }
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target === this) closeLightbox(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });




        const container = document.querySelector('.gallery-container');
        const arrowLeft = document.getElementById('arrowLeft');
        const arrowRight = document.getElementById('arrowRight');
        let currentIndex = 0;
        const totalPaintings = paintings.length;

        arrowRight.addEventListener('click', function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % totalPaintings;
            const items = document.querySelectorAll('.painting-item');
            const item = items[currentIndex];
            const targetLeft = item.offsetLeft - 96;
            if (currentIndex === 0) { container.scrollTo({ left: 0, behavior: 'auto' }); }
            else { container.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' }); }
        });

        arrowLeft.addEventListener('click', function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + totalPaintings) % totalPaintings;
            const items = document.querySelectorAll('.painting-item');
            const item = items[currentIndex];
            const targetLeft = item.offsetLeft - 96;
            if (currentIndex === totalPaintings - 1) { container.scrollTo({ left: container.scrollWidth, behavior: 'auto' }); }
            else { container.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' }); }
        });

        container.addEventListener('scrollend', function() {
            const items = document.querySelectorAll('.painting-item');
            const center = container.scrollLeft + container.clientWidth / 2;
            let closest = 0, closestDist = Infinity;
            items.forEach((item, i) => {
                const dist = Math.abs((item.offsetLeft + item.offsetWidth / 2) - center);
                if (dist < closestDist) { closestDist = dist; closest = i; }
            });
            currentIndex = closest;
        });


    </script>
